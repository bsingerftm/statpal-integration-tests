name: StatPal API Integration Tests

on:
  schedule:
    # Run every 4 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          STATPAL_API_KEY: ${{ secrets.STATPAL_API_KEY }}
        run: npm test

      - name: Upload API Responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-responses-${{ github.run_id }}
          path: test-responses/
          retention-days: 30

      # - name: Email StatPal Support on Failure
      #   if: failure()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 465
      #     secure: true
      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}
      #     subject: "StatPal API Integration Tests Failed"
      #     to: support@statpal.io
      #     from: ${{ secrets.SMTP_USERNAME }}
      #     body: |
      #       StatPal API integration tests have failed.
      #
      #       Branch: ${{ github.ref_name }}
      #       Commit: ${{ github.sha }}
      #       Author: ${{ github.actor }}
      #
      #       View the full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Build Slack Payload
        if: failure()
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "
            const fs = require('fs');

            let summary;
            if (fs.existsSync('test-results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const failures = [];
              for (const file of results.testResults || []) {
                for (const test of file.assertionResults || []) {
                  if (test.status === 'failed') {
                    const name = test.ancestorTitles.concat(test.title).join(' > ');
                    const msg = (test.failureMessages || []).map(m =>
                      m.split('\n').slice(0, 3).join(' ').substring(0, 200)
                    ).join('; ');
                    failures.push('• *' + name + '*\n   ' + msg);
                  }
                }
              }
              summary = failures.length === 0
                ? 'No parsed failures (tests may have timed out or crashed).'
                : failures.join('\n');
            } else {
              summary = 'test-results.json not found — tests may have crashed before producing output.';
            }

            const payload = {
              text: 'StatPal Integration Tests Failed',
              blocks: [
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: ':x: *StatPal Integration Tests Failed*\n' +
                      '*Branch:* \`' + process.env.REF_NAME + '\`\n' +
                      '*Commit:* \`' + process.env.COMMIT_SHA + '\`\n' +
                      '*Author:* ' + process.env.ACTOR,
                  },
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: ':memo: *Failing Tests:*\n' + summary,
                  },
                },
                {
                  type: 'actions',
                  elements: [
                    {
                      type: 'button',
                      text: { type: 'plain_text', text: 'View Run' },
                      url: process.env.RUN_URL,
                    },
                  ],
                },
              ],
            };

            fs.writeFileSync('slack-payload.json', JSON.stringify(payload));
          "

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
